<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="brand" href="{{build.basePath}}/">
      <span class="brand-mark" aria-hidden="true">
        <!-- 站点标记：两连杆机械臂（造型见 partials/mark.html，页脚用的是同一份） -->
        {{> partials/mark.html}}
      </span>
      <span class="brand-text">
        <b>{{site.title}}</b>
        <i>{{site.titleEn}}</i>
      </span>
    </a>

    <nav class="nav-links" aria-label="主导航">
      {{#each nav}}
      <a href="{{build.basePath}}{{href}}"{{#if active}} class="is-active" aria-current="page"{{/if}}>{{label}}</a>
      {{/each}}
    </nav>

    <div class="nav-actions">
      <button class="icon-btn" type="button" data-open-search aria-label="搜索 (Ctrl+K)" title="搜索  Ctrl+K">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.5"/><path d="M16.2 16.2 21 21"/>
        </svg>
      </button>
      <button class="icon-btn" type="button" data-toggle-mode aria-label="切换明暗" title="切换明暗">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/>
        </svg>
      </button>
      <button class="icon-btn" type="button" data-open-settings aria-label="外观设置" title="外观设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/>
          <circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/>
        </svg>
      </button>
      <button class="icon-btn nav-burger" type="button" data-open-menu aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
    </div>
  </div>
</header>
